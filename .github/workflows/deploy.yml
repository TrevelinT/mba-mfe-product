name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: product-dist artifact ID from a successful CI run
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy product-dist to Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      actions: read

    steps:
      - name: Resolve artifact ID
        id: resolve-artifact
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              const artifactId = context.payload.inputs.artifact_id;
              if (!artifactId || !/^\d+$/.test(artifactId)) {
                core.setFailed('artifact_id must be a numeric product-dist artifact ID.');
                return;
              }
              core.setOutput('artifact_id', artifactId);
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: context.sha,
              status: 'success',
              per_page: 1,
            });

            if (data.workflow_runs.length === 0) {
              core.setFailed(
                'No successful CI run found for this commit. Run CI on main first, or deploy via workflow_dispatch with a product-dist artifact ID.',
              );
              return;
            }

            const runId = data.workflow_runs[0].id;
            const { data: artifactsData } =
              await github.rest.actions.listWorkflowRunArtifacts({
                owner: context.repo.owner,
                repo: context.repo.repo,
                run_id: runId,
              });

            const artifact = artifactsData.artifacts.find(
              (a) => a.name === 'product-dist',
            );

            if (!artifact) {
              core.setFailed(
                `No product-dist artifact found on CI run ${runId}. Ensure CI uploaded product-dist for this commit.`,
              );
              return;
            }

            core.setOutput('artifact_id', String(artifact.id));

      - name: Download product-dist from CI
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.resolve-artifact.outputs.artifact_id }}
          path: dist
          github-token: ${{ github.token }}

      - name: Verify federation remote entry
        run: test -f dist/remoteEntry.js || test -f dist/assets/remoteEntry.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
