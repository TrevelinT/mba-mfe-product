name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      artifact_id:
        description: product-dist artifact ID from a successful CI run
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy product-dist to Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      actions: read

    steps:
      - name: Resolve artifact and CI run IDs
        id: resolve-artifact
        uses: actions/github-script@v7
        with:
          script: |
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            function setResolved(artifactId, ciRunId) {
              core.setOutput('artifact_id', String(artifactId));
              core.setOutput('ci_run_id', String(ciRunId));
            }

            async function resolveFromCiRun(runId) {
              const { data: artifactsData } =
                await github.rest.actions.listWorkflowRunArtifacts({
                  owner,
                  repo,
                  run_id: runId,
                });

              const artifact = artifactsData.artifacts.find(
                (a) => a.name === 'product-dist',
              );

              if (!artifact) {
                core.setFailed(
                  `No product-dist artifact found on CI run ${runId}. Ensure CI uploaded product-dist for this commit.`,
                );
                return false;
              }

              setResolved(artifact.id, runId);
              return true;
            }

            async function resolveManualInput(rawInput) {
              if (!rawInput || !/^\d+$/.test(rawInput)) {
                core.setFailed(
                  'artifact_id must be a numeric product-dist artifact ID from the CI job summary (not the workflow run ID from /actions/runs/).',
                );
                return;
              }

              const numericInput = Number(rawInput);

              try {
                const { data: artifact } = await github.rest.actions.getArtifact({
                  owner,
                  repo,
                  artifact_id: numericInput,
                });

                if (artifact.name !== 'product-dist') {
                  core.setFailed(
                    `Artifact ${numericInput} is named "${artifact.name}", not product-dist. Use the artifact_id from the CI job summary or the number after /artifacts/ in the artifact URL.`,
                  );
                  return;
                }

                const ciRunId = artifact.workflow_run?.id;
                if (!ciRunId) {
                  core.setFailed(
                    `Artifact ${numericInput} has no associated workflow run. Try a fresh CI run on main.`,
                  );
                  return;
                }

                setResolved(artifact.id, ciRunId);
                return;
              } catch (error) {
                if (error.status !== 404) {
                  throw error;
                }
              }

              core.warning(
                'Input was not found as an artifact ID; treating it as a CI workflow run ID. Use artifact_id from the CI job summary next time.',
              );

              const ok = await resolveFromCiRun(numericInput);
              if (!ok) {
                core.setFailed(
                  `No product-dist artifact for input ${rawInput}. Copy artifact_id from the CI job summary (number after /artifacts/ in the URL), not the run ID after /actions/runs/.`,
                );
              }
            }

            if (context.eventName === 'workflow_dispatch') {
              await resolveManualInput(context.payload.inputs.artifact_id);
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner,
              repo,
              workflow_id: 'ci.yml',
              head_sha: context.sha,
              status: 'success',
              branch: 'main',
              event: 'push',
              per_page: 1,
            });

            if (data.workflow_runs.length === 0) {
              core.setFailed(
                'No successful main-branch CI run found for this commit. Run CI on main first, or deploy via workflow_dispatch with a product-dist artifact ID.',
              );
              return;
            }

            const runId = data.workflow_runs[0].id;
            await resolveFromCiRun(runId);

      - name: Download product-dist from CI
        uses: actions/download-artifact@v8
        with:
          artifact-ids: ${{ steps.resolve-artifact.outputs.artifact_id }}
          run-id: ${{ steps.resolve-artifact.outputs.ci_run_id }}
          path: dist
          github-token: ${{ github.token }}

      - name: Verify federation remote entry
        run: test -f dist/remoteEntry.js || test -f dist/assets/remoteEntry.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
