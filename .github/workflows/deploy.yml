name: Deploy to GitHub Pages

on:
  workflow_dispatch:
    inputs:
      ci_run_id:
        description: Successful CI workflow run ID that uploaded product-dist
        required: true
        type: string
  push:
    tags:
      - "v*"

concurrency:
  group: pages
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  deploy:
    name: Deploy product-dist to Pages
    runs-on: ubuntu-latest
    timeout-minutes: 10
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref, 'refs/tags/v')
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    permissions:
      pages: write
      id-token: write
      actions: read

    steps:
      - name: Resolve CI run ID
        id: ci-run
        uses: actions/github-script@v7
        with:
          script: |
            if (context.eventName === 'workflow_dispatch') {
              const runId = context.payload.inputs.ci_run_id;
              if (!runId || !/^\d+$/.test(runId)) {
                core.setFailed('ci_run_id must be a numeric CI workflow run ID.');
                return;
              }
              core.setOutput('run_id', runId);
              return;
            }

            const { data } = await github.rest.actions.listWorkflowRuns({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: 'ci.yml',
              head_sha: context.sha,
              status: 'success',
              per_page: 1,
            });

            if (data.workflow_runs.length === 0) {
              core.setFailed(
                'No successful CI run found for this commit. Run CI on main first, or deploy via workflow_dispatch with a CI run ID.',
              );
              return;
            }

            core.setOutput('run_id', String(data.workflow_runs[0].id));

      - name: Download product-dist from CI
        uses: actions/download-artifact@v8
        with:
          name: product-dist
          path: dist
          run-id: ${{ steps.ci-run.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Verify federation remote entry
        run: test -f dist/remoteEntry.js || test -f dist/assets/remoteEntry.js

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: dist

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
