name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize]
  workflow_dispatch:

permissions:
  contents: read
  packages: read
  actions: write

jobs:
  build:
    name: Build and Quality
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@trevelint"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Lint and format
        run: npm run format-and-lint

      - name: Build
        run: npm run build
        env:
          VITE_BASE: /mba-mfe-product/

      - name: Report build artifacts
        run: node scripts/report-build-artifacts.mjs

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: product-dist
          path: dist/
          if-no-files-found: error

      - name: Type check
        run: npm run type-check

      - name: Test
        run: npm run test-coverage

  lighthouse:
    name: Lighthouse CI
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out code
        uses: actions/checkout@v7
        with:
          fetch-depth: 2
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: package.json
          cache: npm
          registry-url: https://npm.pkg.github.com
          scope: "@trevelint"

      - name: Install dependencies
        run: npm ci
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Download build artifacts
        uses: actions/download-artifact@v8
        with:
          name: product-dist
          path: dist/

      - name: Audit with Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
          uploadArtifacts: true
          temporaryPublicStorage: true
          runs: 1
